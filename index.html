<title>Quiz Fé em Casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: coluna única estreita (máx. 640px), uma tela por vez no quiz, página longa de oferta no resultado. */
:root{
  --bg:#eef6ff;
  --surface:#ffffff;
  --surface-2:#e3effd;
  --ink:#10234a;
  --ink-soft:#4a5d85;
  --line:#c9dbf5;
  --blue:#2f6fe4;
  --sun:#ffc83d;
  --sun-deep:#e0a21b;
  --sun-ink:#3a2700;
  --good:#1f8a52;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a33;--surface:#162646;--surface-2:#1c3057;--ink:#f3f7ff;--ink-soft:#a9bbdf;--line:#2a406d;--blue:#6ea1ff;--good:#58d08e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a33;--surface:#162646;--surface-2:#1c3057;--ink:#f3f7ff;--ink-soft:#a9bbdf;--line:#2a406d;--blue:#6ea1ff;--good:#58d08e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-block:8px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.brand{display:flex;justify-content:center;padding:14px 0 10px;font-family:var(--display);font-weight:800;font-size:1.25rem}
.brand b{color:var(--blue);font-weight:800;margin:0 .25em}
.screen{display:flex;flex-direction:column;gap:18px;animation:in .25s ease both}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

/* abertura */
.cover{
  aspect-ratio:16/10;border-radius:22px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#4a9cf5 0%,#9fc8ff 55%,#fff1c2 100%);
  display:grid;place-items:center;text-align:center;padding:16px;
}
.cover .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;filter:blur(.5px)}
.cover .c1{width:90px;height:30px;top:12%;left:8%}
.cover .c2{width:60px;height:22px;top:22%;left:20%}
.cover .c3{width:140px;height:44px;bottom:8%;right:6%}
.cover .c4{width:110px;height:36px;top:8%;right:10%}
.cover-title{position:relative;font-family:var(--display);font-weight:800;color:#fff;font-size:clamp(2rem,9vw,3.2rem);line-height:1;text-shadow:0 3px 0 #3a63b8}
.cover-title small{display:block;font-size:.5em;letter-spacing:.14em;color:#ff7a7a;margin-top:.35em;text-shadow:0 2px 0 #fff}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);text-align:center}
.hero h1{font-size:clamp(1.9rem,7vw,2.6rem);text-align:center}
.hero h1 mark{background:linear-gradient(transparent 58%,var(--sun) 58%);color:inherit;padding:0 .1em}
.lead{color:var(--ink-soft);text-align:center;font-size:1.05rem}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;text-align:center;text-decoration:none;cursor:pointer;
  background:var(--sun);color:var(--sun-ink);font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.2;
  border:0;border-radius:999px;padding:16px 28px;box-shadow:0 5px 0 var(--sun-deep);transition:transform .08s,box-shadow .08s;
}
.btn:hover{transform:translateY(1px);box-shadow:0 4px 0 var(--sun-deep)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-deep)}
.btn:focus-visible,.opt:focus-visible,.back:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.cta-row{display:flex;flex-direction:column;align-items:center;gap:10px}
.fine{font-size:.85rem;color:var(--ink-soft);text-align:center}

/* perguntas */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.back{background:none;border:0;color:var(--blue);font:800 .9rem var(--body);cursor:pointer;padding:4px 0}
.count{font-weight:800;font-size:.9rem;color:var(--ink-soft)}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .35s ease}
.q h2{font-size:clamp(1.6rem,6vw,2.1rem)}
.q .sub{color:var(--ink-soft);margin-top:-6px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:16px;
  font:700 1.02rem/1.3 var(--body);transition:border-color .12s,transform .12s;
}
.opt:hover{border-color:var(--blue)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--surface-2)}
.letter{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--blue);font:800 .9rem var(--display)}

/* resultado */
.result-tag{align-self:center;background:var(--surface-2);color:var(--blue);font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:999px}
.result h1{font-size:clamp(1.8rem,7vw,2.5rem);text-align:center}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.chip small{display:block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.chip strong{font-family:var(--display);font-size:1.1rem}
section.block{display:flex;flex-direction:column;gap:14px;margin-top:34px}
section.block h2{font-size:clamp(1.5rem,5.5vw,2rem)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.days li{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
.days li:last-child{border-bottom:0}
.days b{font-family:var(--display);color:var(--blue)}
.benefits{display:grid;gap:12px}
.benefit h3{font-size:1.15rem;margin-bottom:4px}
.benefit p{color:var(--ink-soft);font-size:.98rem}
.verse{border-left:5px solid var(--sun);padding:6px 0 6px 14px;color:var(--ink-soft)}
.verse b{color:var(--ink)}
.kit{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px}
.item.hl{border-color:var(--sun);border-width:3px}
.mini{width:72px;aspect-ratio:3/4;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 .72rem/1.1 var(--display);text-align:center;padding:6px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.item small{font-weight:800;color:var(--ink-soft);font-size:.78rem}
.item h3{font-size:1.1rem}
.item p{color:var(--ink-soft);font-size:.92rem;line-height:1.4}
.offer{text-align:center;align-items:center}
.price-row{display:flex;flex-direction:column;gap:6px}
.included{display:flex;flex-direction:column}
.included div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-weight:700}
.included div:last-child{border-bottom:0}
.included span:last-child{color:var(--good);font-weight:800;white-space:nowrap}
.price{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1}
.price sup{font-size:1.2rem;vertical-align:top;position:relative;top:.5em;margin-right:4px}
.guarantee{background:var(--surface-2);border-radius:18px;padding:14px 16px;font-size:.95rem;color:var(--ink-soft);text-align:center}
details{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0 16px}
summary{cursor:pointer;font-weight:800;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--blue);font:800 1.3rem var(--display)}
details[open] summary::after{content:"\2212"}
details p{padding:0 0 14px;color:var(--ink-soft)}
.faq{display:flex;flex-direction:column;gap:10px}
footer{margin-top:40px;text-align:center;font-size:.82rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px}

/* capas do kit */
.proof{display:flex;flex-direction:column;gap:10px;min-width:0}
.proof-h{font-size:1.25rem}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;min-width:0;-webkit-overflow-scrolling:touch}
.rail:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.cv{flex:none;width:min(190px,48vw);scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.cv img{display:block;width:100%;max-width:100%;aspect-ratio:420/605;object-fit:cover;border-radius:14px;background:var(--surface-2);box-shadow:0 8px 18px rgba(20,10,60,.22)}
.cv b{font:800 .95rem/1.2 var(--display)}
.cv small{font-size:.78rem;font-weight:800;color:var(--ink-soft)}
img.mini{display:block;width:84px;max-width:100%;aspect-ratio:420/605;object-fit:cover;border-radius:10px;padding:0;background:var(--surface-2);box-shadow:0 4px 10px rgba(20,10,60,.2)}
</style>

  <div class="brand" id="brand"></div>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>

  {t:"O que você mais quer ver no seu filho?", s:"Escolha uma.",
   o:["Aprender a orar sozinho","Conhecer as histórias da Bíblia","Aprender letras e palavras com a Bíblia","Ficar mais tempo longe da tela, concentrado"]},
  {t:"Quanto tempo por dia você teria para isso?", s:"Dez minutos já fazem diferença.",
   o:["10 minutos","20 minutos","30 minutos ou mais"]},
  {t:"Você é...", s:"Última pergunta.",
   o:["Pai ou mãe","Avó ou avô","Professor(a) de escola dominical","Líder de ministério infantil"]}
];

var GOALS = ["pray","stories","letters","focus"];
var HEAD = [
  "Você não precisa de mais tempo. Precisa de atividades que já estejam prontas.",
  "Falta só um caminho claro. Com ele, começar fica simples.",
  "Seu filho não tem falta de fé. Ele precisa de uma Bíblia que seja divertida.",
  "O que falta é material organizado, e isso dá para resolver hoje."
];
var TAGS = ["Perfil: rotina corrida","Perfil: começando agora","Perfil: criança que se distrai fácil","Perfil: busca material de qualidade"];
var BODY = [
  "Quem tem a agenda cheia precisa de algo que se abre e se usa. Cada atividade é curta, vem pronta para imprimir e não exige preparo.",
  "Em vez de decidir o que ensinar a cada dia, você segue uma ordem simples: uma atividade por dia, da mais leve para a mais profunda.",
  "Crianças que perdem o foco aprendem melhor brincando: labirinto, jogo da memória, quebra-cabeça e colorir. O material foi pensado assim.",
  "Tudo fica reunido em arquivos organizados por tema, para você escolher a página certa em segundos e não depender de buscas na internet."
];
var PLANS = {
  pray:[["Dia 1","Conversar sobre o que é orar"],["Dia 2","Oração da criança, para colorir"],["Dia 3","Oração antes do lanche"],["Dia 4","Agradecer por três coisas do dia"],["Dia 5","Oração pela família"],["Dia 6","Criar uma oração com as próprias palavras"],["Dia 7","Orar juntos e escolher o versículo da semana"]],
  stories:[["Dia 1","Noé e a arca, leitura curta"],["Dia 2","Pintar um animal da arca"],["Dia 3","Abraão e Sara, leitura curta"],["Dia 4","Descubra o personagem bíblico"],["Dia 5","Enoque, leitura curta"],["Dia 6","Quebra-cabeça de uma história"],["Dia 7","Contar a história favorita para a família"]],
  letters:[["Dia 1","Letra A: personagem e palavra"],["Dia 2","Letra B: cobrir e colorir"],["Dia 3","Letra C: cobrir e colorir"],["Dia 4","Ligue os pontos até a letra"],["Dia 5","Caça-palavras com nomes bíblicos"],["Dia 6","Escrever o próprio nome e rezar por ele"],["Dia 7","Revisar as letras e escolher um versículo"]],
  focus:[["Dia 1","Labirinto bíblico até Jesus"],["Dia 2","Jogo da memória"],["Dia 3","Circule a atitude que agrada a Deus"],["Dia 4","Ligue os pontos"],["Dia 5","Quebra-cabeça bíblico"],["Dia 6","Oração da criança"],["Dia 7","Versículo da semana: Mateus 19:14"]]
};
var FAQ = [
  ["Como eu recebo?","Logo após a confirmação do pagamento, você recebe o acesso por e-mail e pode baixar os arquivos na hora."],
  ["Preciso imprimir?","Não é obrigatório. Dá para usar na tela, mas as atividades funcionam melhor impressas, e você pode imprimir quantas vezes quiser."],
  ["Serve para qual idade?","O material foi pensado para crianças de 2 a 10 anos. O seu resultado do quiz indica por onde começar."],
  ["Posso usar na igreja ou escola dominical?","Pode. Muitos professores e líderes imprimem as páginas para a turma toda."],
  ["Tem mensalidade?","Não. O pagamento é único, sem renovação."],
  ["E se eu não gostar?","Você tem "+CONFIG.guaranteeDays+" dias de garantia. Se não for para você, peça o reembolso pela plataforma de pagamento."]
];

var state = {step:-1, answers:[]};
var app = document.getElementById("app");
var LETTERS = "ABCDE";

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function totalPages(){return CONFIG.kit.reduce(function(a,k){return a+k.pages},0)}
function who(){
  var r = state.answers[6], q = state.answers[0];
  if(r===1) return {kid:"seu neto", poss:"dele", pl:false};
  if(r===2||r===3||q===4) return {kid:"as crianças da turma", poss:"delas", pl:true};
  return {kid:"seu filho", poss:"dele", pl:false};
}


function proofHtml(){
  var h='<div class="proof"><h3 class="proof-h">Veja as capas de todo o kit</h3><div class="rail" tabindex="0" aria-label="Capas dos materiais do kit">';
  CONFIG.kit.forEach(function(k){
    h+='<div class="cv"><img src="'+IMG[k.key]+'" alt="Capa de '+esc(k.title)+'"><div><b>'+esc(k.title)+'</b><br><small>'+k.pages+' páginas</small></div></div>';
  });
  return h+'</div><p class="fine">Deslize para o lado para ver todas as capas.</p></div>';
}

function renderBrand(){
  document.getElementById("brand").innerHTML = esc(CONFIG.brandA)+"<b>"+esc(CONFIG.brandB)+"</b>"+esc(CONFIG.brandC);
  document.getElementById("foot").innerHTML = "<span>"+esc(CONFIG.brandA+" "+CONFIG.brandB+" "+CONFIG.brandC)+" · Atividades Bíblicas</span><span>Material de apoio educacional e devocional. Este site não é afiliado ao Facebook, Instagram ou Meta.</span>";
}

function go(step){
  state.step = step;
  render();
  window.scrollTo(0,0);
}

function render(){
  if(state.step === -1) return renderIntro();
  if(state.step < Q.length) return renderQuestion();
  return renderResult();
}

function renderIntro(){
  app.innerHTML =
  '<div class="screen hero">'+
    '<div class="cover" role="img" aria-label="Capa com nuvens e o título Atividades Bíblicas">'+
      '<i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i>'+
      '<div class="cover-title">'+esc(CONFIG.brandA)+' '+esc(CONFIG.brandB)+' '+esc(CONFIG.brandC)+'<small>ATIVIDADES BÍBLICAS</small></div>'+
    '</div>'+
    '<div class="eyebrow">Quiz rápido para pais, mães e professores</div>'+
    '<h1>Seu filho está crescendo. <mark>A fé dele está crescendo junto?</mark></h1>'+
    '<p class="lead">Responda 7 perguntas de 1 minuto e receba um plano para ensinar a Bíblia às crianças, do jeito que combina com a sua rotina.</p>'+
    '<div class="cta-row"><button class="btn" id="start">Começar o quiz grátis</button><p class="fine">Leva menos de 1 minuto. Sem cadastro.</p></div>'+
  '</div>';
  document.getElementById("start").onclick = function(){go(0)};
}

function renderQuestion(){
  var i = state.step, q = Q[i], sel = state.answers[i];
  var html = '<div class="screen q">'+
    '<div class="topbar">'+(i>0?'<button class="back" id="back">← Voltar</button>':'<span></span>')+'<span class="count">'+(i+1)+' de '+Q.length+'</span></div>'+
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+Q.length+'" aria-valuenow="'+i+'"><i style="width:'+(i/Q.length*100)+'%"></i></div>'+
    '<h2>'+esc(q.t)+'</h2><p class="sub">'+esc(q.s)+'</p><div class="opts">';
  q.o.forEach(function(o,k){
    html += '<button class="opt" data-k="'+k+'" aria-pressed="'+(sel===k)+'"><span class="letter">'+LETTERS[k]+'</span><span>'+esc(o)+'</span></button>';
  });
  html += '</div></div>';
  app.innerHTML = html;
  var b = document.getElementById("back"); if(b) b.onclick = function(){go(i-1)};
  Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(btn){
    btn.onclick = function(){
      state.answers[i] = +btn.getAttribute("data-k");
      Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(x){x.setAttribute("aria-pressed", x===btn)});
      setTimeout(function(){go(i+1)}, 220);
    };
  });
}

function renderResult(){
  var a = state.answers, w = who();
  var goal = GOALS[a[4]], prof = a[3];
  var minutes = [10,20,30][a[5]];
  var routine = ["Ponto de partida","Base na igreja","Hábito em formação","Rotina já criada"][a[2]];
  var screens = ["Pouco","Moderado","Alto","Muito alto"][a[1]];
  var timeLine = minutes>=30 ? "Com "+minutes+" minutos ou mais por dia, dá para fazer duas atividades seguidas e conversar sobre elas." :
                 minutes===20 ? "Com 20 minutos por dia, você já escolhe uma atividade e faz junto com "+w.kid+"." :
                                "Com 10 minutos por dia, uma página curta já cria o hábito.";
  var plan = PLANS[goal];
  var pages = totalPages();
  var h = '<div class="screen result">'+
    '<span class="result-tag">'+esc(TAGS[prof])+'</span>'+
    '<h1>'+esc(HEAD[prof])+'</h1>'+
    '<p class="lead">'+esc(BODY[prof])+' '+esc(timeLine)+'</p>'+
    '<div class="chips">'+
      '<div class="chip"><small>Tempo em telas</small><strong>'+screens+'</strong></div>'+
      '<div class="chip"><small>Fé na rotina</small><strong>'+routine+'</strong></div>'+
      '<div class="chip"><small>Tempo por dia</small><strong>'+minutes+' min</strong></div>'+
    '</div>'+
    '<div class="cta-row"><a class="btn go" href="#">Quero começar por R$ '+CONFIG.price+'</a><p class="fine">Acesso imediato · Garantia de '+CONFIG.guaranteeDays+' dias</p></div>'+
  '</div>';

  h += '<section class="block"><div class="eyebrow" style="text-align:left">O que muda na prática</div>'+
    '<h2>Menos improviso para você, mais momentos longe das telas.</h2>'+
    '<div class="panel benefits">'+
      '<div class="benefit"><h3>Menos improviso</h3><p>Em vez de buscar atividades toda vez, você abre o material, escolhe uma página e começa.</p></div>'+
      '<div class="benefit"><h3>Mais tempo longe da tela</h3><p>Colorir, descobrir personagens, brincar e conversar sobre histórias bíblicas com atividades prontas.</p></div>'+
      '<div class="benefit"><h3>Fé na rotina, sem complicação</h3><p>Alguns minutos por dia para passar valores cristãos de um jeito que a criança entende.</p></div>'+
    '</div>'+
    '<p class="verse"><b>Provérbios 22:6</b> fala de orientar a criança desde cedo no caminho em que ela deve andar.</p>'+
  '</section>';

  h += '<section class="block"><div class="eyebrow" style="text-align:left">Seu plano para a primeira semana</div>'+
    '<h2>Sugestão de uma atividade por dia para '+esc(w.kid)+'.</h2>'+
    '<div class="panel"><ul class="days">';
  plan.forEach(function(d){h += '<li><b>'+d[0]+'</b><span>'+esc(d[1])+'</span></li>'});
  h += '</ul></div><p class="fine">Sugestão de uso. Você adapta ao ritmo '+esc(w.poss)+'.</p></section>';

  h += '<section class="block"><div class="eyebrow" style="text-align:left">O que você recebe</div>'+
    '<h2>O kit completo para ensinar a Bíblia de um jeito que a criança queira participar.</h2>'+
    '<p class="lead" style="text-align:left">São '+CONFIG.kit.length+' materiais e '+pages+' páginas em PDF. Você escolhe a atividade, imprime e começa. O material mais alinhado às suas respostas está destacado.</p>'+
    '<div class="kit">';
  CONFIG.kit.forEach(function(k){
    var hl = k.key===goal;
    h += '<div class="item'+(hl?' hl':'')+'"><img class="mini" src="'+IMG[k.key]+'" alt="Capa de '+esc(k.title)+'">'+
      '<div><small>'+k.pages+' páginas'+(hl?' · indicado para você':'')+'</small><h3>'+esc(k.title)+'</h3><p>'+esc(k.text)+'</p></div></div>';
  });
  h += '</div>'+proofHtml()+'<div class="cta-row"><a class="btn go" href="#">Quero receber as '+pages+' páginas por R$ '+CONFIG.price+'</a></div></section>';

  h += '<section class="block offer"><div class="eyebrow">Sua oferta</div><h2>Tudo isso por R$ '+CONFIG.price+', uma única vez.</h2>'+
    '<div class="panel included" style="width:100%;text-align:left">';
  CONFIG.kit.forEach(function(k){h += '<div><span>'+esc(k.title)+' ('+k.pages+' págs)</span><span>incluso</span></div>'});
  h += '<div><span>Acesso imediato pela área de membros</span><span>incluso</span></div>'+
    '<div><span>Imprima quantas vezes quiser</span><span>incluso</span></div></div>'+
    '<div class="price-row"><div class="price"><sup>R$</sup>'+CONFIG.price+'</div><p class="fine">Pagamento único, sem mensalidade · '+pages+' páginas em PDF · '+CONFIG.kit.length+' materiais</p></div>'+
    '<a class="btn go" href="#">Sim, quero o kit por R$ '+CONFIG.price+'</a>'+
    '<p class="guarantee"><b>Risco zero.</b> Garantia de '+CONFIG.guaranteeDays+' dias. Se não for para você, peça o reembolso pela plataforma de pagamento. Compra segura: o acesso chega após a confirmação do pagamento.</p>'+
  '</section>';

  h += '<section class="block"><h2>Dúvidas rápidas</h2><div class="faq">';
  FAQ.forEach(function(f){h += '<details><summary>'+esc(f[0])+'</summary><p>'+esc(f[1])+'</p></details>'});
  h += '</div><div class="cta-row"><a class="btn go" href="#">Quero o kit completo por R$ '+CONFIG.price+'</a></div></section>';

  app.innerHTML = h;
  Array.prototype.forEach.call(app.querySelectorAll("a.go"), function(el){
    el.setAttribute("href", CONFIG.checkoutUrl);
    if(CONFIG.checkoutUrl !== "#"){ el.setAttribute("target","_blank"); el.setAttribute("rel","noopener"); }
  });
}

renderBrand();
render();
</script>

</body></html>
